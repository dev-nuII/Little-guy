<script>
// --enable notifications
  document.getElementById("enableNotifs").addEventListener("click", async () => {
  await setupPush();
  document.getElementById("enableNotifs").style.display = "none"; // hide once done
});
// ---------- CANVAS SETUP ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let canvasScale = 1; // CSS pixels per logical (800-wide) unit

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const cssWidth = Math.min(window.innerWidth, 800);
  const cssHeight = cssWidth * (600 / 800);
  canvas.style.width = cssWidth + "px";
  canvas.style.height = cssHeight + "px";
  canvas.width = cssWidth * dpr;
  canvas.height = cssHeight * dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.scale((cssWidth / 800) * dpr, (cssWidth / 800) * dpr);
  ctx.font = "20px monospace";
  ctx.textBaseline = "top";
  canvasScale = cssWidth / 800; // <-- new: remember this for click mapping
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

// ---------- COLORS ----------
const WHITE = "#ffffff";
const GREEN = "#00ff00";
const RED = "#ff0000";
const YELLOW = "#ffff00";
const BLUE = "#0000ff";
const ORANGE = "#ff7f00";
const BLACK = "#000000";

// ---------- STATE ----------
let state = {
  x: 180, y: 0, x1: 0,
  mood: 2, mental_state: "neutral",
  hp: 5, hunger: 20,
  bond: 0, streak: 0,
  pets_today: 8,
  season: "fall", weather: "",
  lilstate: "", lilstate1: "",
  speech_timer: 0, current_line: "",
  session_seconds: 0,
  animation: 0, animation_seconds_override: 0,
  lilguy_color: GREEN,
  running: true,
  event_running: false, change_change: 0, changevar: 1,
  lilguy2_0: false, one: 0,
  save_num: 0,
  last_open_date: null,   // Date object, UTC midnight
  last_open_date_str: null,
  gap: 0,
  highest_bond: 0,
  unlocked_tiers: [],
  seen_first_snow: false,
  moment_active: false,
  moment_expires_at: 0,
  presence_moment_active: false,
  presence_moment_expires_at: 0,
  line_display_timer: 0,
  last_line_seen: "",
};

let hunger_drain_weather = 1.0;
let mods = { hunger_drain: 1.0, bond_mult: 1.0 };
let weather_particles = [];

const exit_rect  = { x: 590, y: 120, w: 50, h: 50 };
const feed_rect  = { x: 590, y: 180, w: 50, h: 50 };
let lilguy_rect  = { x: state.x, y: 450, w: 30, h: 20 };
const ground_rect = { x: 0, y: 485, w: 3200, h: 460 };
const ground_rect2 = { x: 400, y: 485, w: 3200, h: 460};
  
// ---------- DIALOGUE ----------
const dialogue = {
  happy: [
    "hehe :)", "today's a good day", "glad you're here",
    "i love you <3", "i like it when you're around",
    "thank you for spending time with me",
  ],
  neutral: [
    "...", "just vibing", "hm", "wassup.",
    "today felt normal. in a good way",
    "do you ever wonder why theres so much violence",
    "i've been thinking about that walk earlier",
    "do you ever wonder what's outside the window",
    "sometimes i just sit here and think",
    "someday...ill see others like me",
  ],
  angry: [
    ">:(", "not now.", ">:{", "leave me alone.",
    "its lonely when you leave me",
  ],
  winter: ["it's cold out there, huh", "i wish i could see snow", "let's stay inside today"],
  spring: ["everything is growing again", "i can smell the flowers. probably.", "spring always feels hopeful"],
  summer: ["it's so warm out", "summer's my favorite honestly", "i bet its bright outside right now"],
  fall: ["the leaves must be falling", "fall always feels a little nostalgic", "cozy season, right?"],
};

const season_colors = {
  winter: "rgb(225,240,255)",
  spring: "rgb(230,255,230)",
  summer: "rgb(255,250,205)",
  fall:   "rgb(255,235,210)",
};
const BOND_SCALE = 50; // every bond gain gets multiplied by this internally
  const unlockTiers = [
  { threshold: 10 * BOND_SCALE, sprite: "wink",       frames: ["^_^", "^_^"],   lines: ["hehe, i feel closer to you now", "something feels different. good different."] },
  { threshold: 30 * BOND_SCALE, sprite: "dance",      frames: ["\\o/", "/o\\"], lines: ["i wanna dance!!", "watch this!"] },
  { threshold: 60 * BOND_SCALE, sprite: "heart_eyes", frames: ["<3_<3", "<3_<3"], lines: ["you're my favorite person, you know that?", "i really mean it. thank you."] },
  { threshold: 100 * BOND_SCALE, sprite: "royal",     frames: ["[o]", "[o]"],   lines: ["we've really been through it together huh", "i wouldn't trade this for anything"] },
];

dialogue.angry_missed = [
  "you were gone a while. i got weird about it. sorry.",
  "i wasn't really mad. i think i was just worried.",
  "it's dumb, i know you have a life. i still don't love the quiet though.",
];
const keep_rect = { x: 300, y: 500, w: 90, h: 40 };
const share_rect = { x: 420, y: 500, w: 90, h: 40 };
const goodnight_rect = { x: 660, y: 180, w: 50, h: 50 };

const season_modifiers = {
  winter: { hunger_drain: 1.25, bond_mult: 0.9 },
  spring: { hunger_drain: 1.0,  bond_mult: 1.1 },
  summer: { hunger_drain: 0.9,  bond_mult: 1.0 },
  fall:   { hunger_drain: 1.0,  bond_mult: 1.0 },
};

const weather_visuals = {
  rain:   { char: "|", color: "rgb(100,150,255)", speed: 8,  spawn_chance: 3,  mode: "fall" },
  snow:   { char: "*", color: "rgb(255,255,255)", speed: 2,  spawn_chance: 5,  mode: "fall" },
  storm:  { char: "|", color: "rgb(80,100,160)",  speed: 12, spawn_chance: 2,  mode: "fall" },
  cloudy: { char: "~", color: "rgb(200,200,210)", speed: 1,  spawn_chance: 40, mode: "drift" },
  clear:  { char: "o", color: "rgb(255,220,80)",  speed: 0,  spawn_chance: 0,  mode: "sun" },
};

// ---------- HELPERS ----------
function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
function choice(arr) { return arr[randInt(0, arr.length - 1)]; }

function isNightTime() {
  const h = new Date().getHours();
  return h >= 22 || h < 6;
}

function checkUnlocks() {
  if (state.bond > state.highest_bond) state.highest_bond = state.bond;
  for (const tier of unlockTiers) {
    if (state.highest_bond >= tier.threshold && !state.unlocked_tiers.includes(tier.threshold)) {
      state.unlocked_tiers.push(tier.threshold);
      dialogue[tier.sprite] = tier.lines;
      state.current_line = tier.lines[0];
      state.line_display_timer = 0;
      saveToCloud();
    }
  }
}
function drawWrappedText(text, x, y, maxWidth, lineHeight, color) {
  const words = text.split(" ");
  let line = "";
  let currentY = y;
  ctx.fillStyle = color;
  for (const word of words) {
    const testLine = line + word + " ";
    if (ctx.measureText(testLine).width > maxWidth && line !== "") {
      ctx.fillText(line, x, currentY);
      line = word + " ";
      currentY += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, currentY);
}
  
async function getIp() {
  const response = await fetch('https://api.ipify.org?format=json');
  const data = await response.json();
  return data.ip;
}

function relationshipDescriptor() {
  if (state.bond >= 100 * BOND_SCALE) return "inseparable";
  if (state.bond >= 60 * BOND_SCALE) return "close";
  if (state.bond >= 30 * BOND_SCALE) return "comfortable";
  if (state.bond >= 10 * BOND_SCALE) return "getting to know each other";
  return "just met";
}

function dateOnlyUTC(d) {
  return new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
}

function gainBond(baseAmount) {
  const noise = 0.85 + Math.random() * 0.3; // ±15% variance
  const gained = Math.round(baseAmount * BOND_SCALE * mods.bond_mult * noise);
  state.bond += gained;
  checkUnlocks();
}

function daysBetween(d1, d2) {
  return Math.round((d2 - d1) / 86400000);
}

function fillRect(x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w, h);
}
function drawText(text, x, y, color) {
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}
function clearScreen(color) {
  fillRect(0, 0, canvas.width, canvas.height, color);
}

// ---------- FIREBASE ----------
async function loadSave() {
  try {
    const resp = await fetch("https://lilguy-notifier.vercel.app/api/load-save");

    if (!resp.ok) {
      throw new Error("Server returned " + resp.status);
    }

    const data = await resp.json();

    return data.save;

  } catch (e) {
    console.log("cloud load failed:", e);
    return null;
  }
}

async function saveToCloud() {

  const data = {
    mental_state: state.mental_state,
    mood: state.mood,
    event_running: state.event_running,
    hp: state.hp,
    lilguy2_0: state.lilguy2_0,
    one: state.one,
    change_change: state.change_change,
    changevar: state.changevar,
    x_pos: state.x,
    y_pos: state.y,
    x1_pos: state.x1,
    last_open_date: new Date().toISOString().slice(0, 10),
    streak: state.streak,
    bond: state.bond,
    animation: state.animation,
    last_hunger_check: new Date().toISOString(),
    hunger: state.hunger,
    machine_id: "web-client",
    pets_today: state.pets_today,
    last_pet_str: new Date().toISOString(),
    weather: state.weather,
    save_num: state.save_num,
    userIp: await getIp(),
    highest_bond: state.highest_bond,
    unlocked_tiers: state.unlocked_tiers,
    seen_first_snow: state.seen_first_snow,
  };

  try {

    const response = await fetch("https://lilguy-notifier.vercel.app/api/save-game", {
      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(data)
    });

    if (!response.ok) {
      throw new Error("Save failed: HTTP " + response.status);
    }

  } catch (e) {
    console.log("cloud save failed:", e);
  }
}

// ---------- WEATHER FETCH ----------
async function fetchWeather() {
  let lat = 0, lon = 0;
  try {
    const resp = await fetch("https://ipapi.co/json/");
    const data = await resp.json();
    lat = data.latitude;
    lon = data.longitude;
  } catch (e) {
    console.log("location lookup failed:", e);
  }

  let code = null;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    const resp = await fetch(url);
    const data = await resp.json();
    code = data.current_weather.weathercode;
  } catch (e) {
    console.log("weather lookup failed:", e);
  }

  let weather;
  if (code === 0) weather = "clear";
  else if ([1, 2, 3].includes(code)) weather = "cloudy";
  else if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) weather = "rain";
  else if ([71, 73, 75, 77, 85, 86].includes(code)) weather = "snow";
  else if ([95, 96, 99].includes(code)) weather = "storm";
  else weather = "clear";

  let drain = 1.0;
  if (weather === "rain") drain = 1.1;
  else if (weather === "storm") { drain = 1.15; state.mood += randInt(0, 1) * -1; }
  else if (weather === "snow") drain = 1.2;

  return { weather, drain };
}

// ---------- STARTUP ----------
async function startup() {
  // season
  const month = new Date().getMonth() + 1;
  if ([12, 1, 2].includes(month)) state.season = "winter";
  else if ([3, 4, 5].includes(month)) state.season = "spring";
  else if ([6, 7, 8].includes(month)) state.season = "summer";
  else state.season = "fall";
  mods = season_modifiers[state.season];

  // first snow
  if (state.weather === "snow" && !state.seen_first_snow) {
  state.seen_first_snow = true;
  clearScreen(BLACK);
  drawText("...wait.", 300, 250, WHITE);
  await sleep(1800);
  clearScreen(BLACK);
  drawText("what IS that?", 260, 250, WHITE);
  await sleep(1800);
  clearScreen(BLACK);
  drawText("it's so quiet. and everything's turning white.", 130, 250, "rgb(200,220,255)");
  await sleep(2500);
  clearScreen(BLACK);
  drawText("i've never seen anything like this before.", 150, 250, "rgb(200,220,255)");
  await sleep(2500);
  state.bond += 8;
  checkUnlocks();
}
  // weather
  const w = await fetchWeather();
  state.weather = w.weather;
  hunger_drain_weather = w.drain;

  // load save
  const saved = await loadSave();
  const today = dateOnlyUTC(new Date());

  if (saved) {
    state.mental_state = saved.mental_state ?? state.mental_state;
    state.mood = saved.mood ?? state.mood;
    state.event_running = saved.event_running ?? false;
    state.hp = saved.hp ?? state.hp;
    state.one = saved.one ?? 0;
    state.change_change = saved.change_change ?? 0;
    state.changevar = saved.changevar ?? 1;
    state.x = saved.x_pos ?? state.x;
    state.y = saved.y_pos ?? state.y;
    state.x1 = saved.x1_pos ?? state.x1;
    state.streak = saved.streak ?? 0;
    state.bond = saved.bond ?? 0;
    state.animation = saved.animation ?? 0;
    state.hunger = saved.hunger ?? state.hunger;
    state.pets_today = saved.pets_today ?? 8;
    state.save_num = saved.save_num ?? 0;
    state.highest_bond = saved.highest_bond ?? state.bond;
    state.unlocked_tiers = saved.unlocked_tiers ?? [];
    state.seen_first_snow = saved.seen_first_snow ?? false;

    for (const tier of unlockTiers) {
  if (state.unlocked_tiers.includes(tier.threshold)) {
    dialogue[tier.sprite] = tier.lines;
  }
}

    // pets regen from last_pet_str
    if (saved.last_pet_str) {
      const lastPet = new Date(saved.last_pet_str);
      const hoursPassed = (Date.now() - lastPet.getTime()) / 3600000;
      state.pets_today = Math.min(8, state.pets_today + Math.floor(hoursPassed));
    }

    // hunger decay from last_hunger_check
    if (saved.last_hunger_check) {
      const lastHunger = new Date(saved.last_hunger_check);
      const hoursPassed = (Date.now() - lastHunger.getTime()) / 3600000;
      state.hunger = Math.max(0, state.hunger - Math.floor(hoursPassed));
    }

    // streak calc
    if (saved.last_open_date) {
      state.last_open_date = dateOnlyUTC(new Date(saved.last_open_date));
      state.gap = daysBetween(state.last_open_date, today);
      if (state.gap === 1) {
        state.save_num += 1;
      } else if (state.gap === 2) {
        state.streak += 1;
        state.save_num += 1;
        state.pets_today = 8;
      } else {
        state.streak = 1;
      }
    } else {
      state.streak = 1;
      state.gap = 999;
    }
  } else {
    state.streak = 1;
    state.gap = 999;
  }

  // hunger influences mental state
  if (state.hunger <= 2) {
    state.mental_state = "bad";
    state.mood = 3;
  }

  // deciding today's mood (only on a new day)
  const isNewDay = !state.last_open_date || daysBetween(state.last_open_date, today) !== 1;
  if (isNewDay) {
    const offDayChance = randInt(1, 10);
    const dailyLuck = randInt(1, 5);
    state.bond += dailyLuck;
    if (offDayChance === 1) state.mood = 3;
    else if (state.streak >= 3) state.mood = choice([1, 1, 2]);
    else state.mood = randInt(1, 2);
  }

  // convert mood to mental state
  if (state.mood === 1) state.mental_state = "good";
  else if (state.mood === 3) state.mental_state = "bad";
  else state.mental_state = "neutral";

  // contributions screen
  clearScreen(BLACK);
  drawText("Made by your_local_robit and outside help.", 60, 300, YELLOW);
  await sleep(3000)
  clearScreen(BLACK);
  if (saved && saved.recovery_code) {
  drawText("Recovery code: " + saved.recovery_code, 60, 330, YELLOW);
}
  await sleep(3000);

  // greeting
  clearScreen(BLACK);
  let greeting;
  if (state.gap === 0) greeting = "back already? nice";
  else if (state.gap === 1) greeting = "hey! good to see you";
  else if (state.gap <= 3) greeting = "it's been a bit, welcome back";
  else greeting = "oh — hey. it's been a while";
  drawText(greeting, 60, 260, state.lilguy_color);
  await sleep(2000);

  lilguy_rect.x = state.x;
  mainLoop();
}

// ---------- MAIN LOOP (runs once per second, matching original clock.tick(1)) ----------
function tick() {
  if (!state.running) return;

  // hunger loop
  if (state.session_seconds % 3600 === 0 && state.session_seconds !== 0) {
    state.hunger = Math.max(0, state.hunger - mods.hunger_drain * hunger_drain_weather);
    state.pets_today = Math.min(8, state.pets_today + 1);
  }
  // bond tiers in tick()
if (state.bond >= 100 * BOND_SCALE) state.lilguy_color = YELLOW;
else if (state.bond >= 30 * BOND_SCALE) state.lilguy_color = "rgb(0,220,150)";
else state.lilguy_color = GREEN;
  // dialogue
  state.speech_timer += 1;
  if (state.speech_timer >= 120) {
    state.speech_timer = 0;
    if (randInt(1, 4) === 1) state.current_line = choice(dialogue[state.season]);
    else if (state.mood === 1) state.current_line = choice(dialogue.happy);
    else if (state.mood === 2) state.current_line = choice(dialogue.neutral);
    if (randInt(1, 4) === 1) state.current_line = choice(dialogue[state.season]);
    else if (state.mood === 3) {
  state.current_line = state.gap >= 1 ? choice(dialogue.angry_missed) : choice(dialogue.angry);
}
  }
  if (state.current_line !== state.last_line_seen) {
  state.last_line_seen = state.current_line;
  state.line_display_timer = 0;
} else if (state.current_line) {
  state.line_display_timer += 1;
  if (state.line_display_timer >= 5) {
    state.current_line = "";
    state.last_line_seen = "";
  }
}
  // meaningful choice moment
if (!state.moment_active && !state.presence_moment_active && state.mood !== 3 && randInt(1, 1200) === 1) {
  state.moment_active = true;
  state.moment_expires_at = state.session_seconds + 20;
  state.current_line = "hey... i found something. what should we do with it?";
}
if (state.moment_active && state.session_seconds >= state.moment_expires_at) {
  state.moment_active = false;
  state.current_line = "...guess it didn't matter that much.";
  state.mood = state.mood === 1 ? 2 : state.mood;
}

// presence moment
if (!state.moment_active && !state.presence_moment_active && state.mood !== 3 && randInt(1, 1800) === 1) {
  state.presence_moment_active = true;
  state.presence_moment_expires_at = state.session_seconds + 12;
  state.current_line = "can you just... stay for a second?";
}
if (state.presence_moment_active && state.session_seconds >= state.presence_moment_expires_at) {
  state.presence_moment_active = false;
  state.current_line = "...thanks for staying.";
}
  // animations
  if (state.session_seconds % 30 === 0 || state.animation_seconds_override !== 0) {
   if (state.mood === 1) {
    const unlockedSprites = unlockTiers
      .filter(t => state.unlocked_tiers.includes(t.threshold))
      .map(t => t.sprite);
    const idle = choice(["walk", "wave", ...unlockedSprites]);
    if (idle === "walk") { state.lilstate = "_>"; state.lilstate1 = "<_"; state.animation = 1; }
    else if (idle === "wave") { state.lilstate = "0/"; state.lilstate1 = "0/"; state.animation = 3; }
    else {
      const tier = unlockTiers.find(t => t.sprite === idle);
      state.lilstate = tier.frames[0];
      state.lilstate1 = tier.frames[1];
    }
  } else {
    const idle = choice(["walk", "sit"]);
    if (idle === "walk") { state.lilstate = "_>"; state.lilstate1 = "<_"; state.animation = 1; }
    else { state.lilstate = "o"; state.lilstate1 = "o"; state.animation = 2; }
  }
  }
  state.session_seconds += 1;

  // movement
  let text_surface = "_>";
  if (state.lilstate === "_>" && state.lilstate1 === "<_") {
    if (state.y === 1) {
      text_surface = "_>";
      state.x -= 10;
      if (state.x === 180) state.y = 0;
    } else {
      text_surface = "<_";
      state.x += 10;
      if (state.x === 600) state.y = 1;
    }
  } else if (state.lilstate === "0/" && state.lilstate1 === "0/") {
    text_surface = "0/";
  } else if (state.lilstate === "o" && state.lilstate1 === "o") {
    text_surface = "o";
  } else if (state.lilstate === "-.-" && state.lilstate1 === "-.-") {
  text_surface = "-.-";
} else {
  const tier = unlockTiers.find(t => t.frames[0] === state.lilstate);
  if (tier) text_surface = tier.frames[0];
}
  lilguy_rect = { x: state.x, y: 450, w: 30, h: 20 };

  draw(text_surface);
}

function draw(text_surface) {
  clearScreen(season_colors[state.season]);
  // choice and goodbye buttons
  if (state.moment_active) {
  fillRect(keep_rect.x, keep_rect.y, keep_rect.w, keep_rect.h, "rgb(100,200,100)");
  drawText("keep it", keep_rect.x + 10, keep_rect.y + 10, BLACK);
  fillRect(share_rect.x, share_rect.y, share_rect.w, share_rect.h, "rgb(100,150,220)");
  drawText("give it", share_rect.x + 10, share_rect.y + 10, BLACK);
}
if (isNightTime()) {
  fillRect(goodnight_rect.x, goodnight_rect.y, goodnight_rect.w, goodnight_rect.h, "rgb(60,60,100)");
  drawText("zzz", goodnight_rect.x + 8, goodnight_rect.y + 15, WHITE);
}
  // mood text
  if (state.mood === 1) drawText("mood :   :)", 140, 125, GREEN);
  else if (state.mood === 2) drawText("mood :  :|", 140, 125, YELLOW);
  else if (state.mood === 3) drawText("mood :   >:{", 140, 125, RED);

  // current dialogue line
  if (state.current_line) {
  const clampedX = Math.min(state.x, 620);
  drawWrappedText(state.current_line, clampedX, 430, 170, 22, state.lilguy_color);
}
  // lil guy sprite
  drawText(text_surface, state.x, 450, state.lilguy_color);

  // weather
  const v = weather_visuals[state.weather];
  if (v) {
    if (v.mode === "fall") {
      if (randInt(1, v.spawn_chance) === 1) {
        weather_particles.push([randInt(0, 800), randInt(250, 400)]);
      }
      weather_particles.forEach(p => {
        p[1] += v.speed;
        drawText(v.char, p[0], p[1], v.color);
      });
      weather_particles = weather_particles.filter(p => p[1] < 600);
    } else if (v.mode === "drift") {
      if (randInt(1, v.spawn_chance) === 1) {
        weather_particles.push([-20, randInt(260, 400)]);
      }
      weather_particles.forEach(p => {
        p[0] += v.speed;
        drawText("~~~", p[0], p[1], v.color);
      });
      weather_particles = weather_particles.filter(p => p[0] < 850);
    } else if (v.mode === "sun") {
      drawText("* SUN *", 680, 260, v.color);
    }
  } else {
    weather_particles = [];
  }

  // divider
  ctx.strokeStyle = BLACK;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 250);
  ctx.lineTo(800, 250);
  ctx.stroke();

  // GUI
  drawText(state.mental_state, 140, 180, GREEN);
  drawText(String(Math.round(state.hunger)), 230, 157, RED);
  drawText("HUNGER=", 140, 157, RED);
  drawText(relationshipDescriptor(), 140, 200, GREEN);
  fillRect(exit_rect.x, exit_rect.y, exit_rect.w, exit_rect.h, RED);
  fillRect(feed_rect.x, feed_rect.y, feed_rect.w, feed_rect.h, BLUE);
  fillRect(ground_rect.x, ground_rect.y, ground_rect.h, ground_rect.w, BLACK);
  fillRect(ground_rect2.x, ground_rect2.y, ground_rect2.h, ground_rect2.w, BLACK); 
  
}

// ---------- INPUT ----------
function handleClick(clickX, clickY) {
  if (state.moment_active) {
  if (pointInRect(clickX, clickY, keep_rect)) {
    state.bond += 2;
    state.hunger = Math.min(20, state.hunger + 4);
    state.current_line = "i'll hang on to this. thanks for letting me.";
    state.moment_active = false;
    checkUnlocks();
    saveToCloud();
    return;
  }
  if (pointInRect(clickX, clickY, share_rect)) {
    state.bond += 6;
    state.current_line = "i gave it away. felt kinda good actually.";
    state.moment_active = false;
    checkUnlocks();
    saveToCloud();
    return;
  }
}

if (isNightTime() && pointInRect(clickX, clickY, goodnight_rect)) {
  state.current_line = choice([
    "goodnight. i'll be here when you wake up.",
    "sleep well. i mean it.",
    "night. today was a good one, i think.",
  ]);
  state.lilstate = "-.-";
  state.lilstate1 = "-.-";
  return;
}
  if (pointInRect(clickX, clickY, exit_rect)) {
    state.running = false;
    clearScreen(season_colors[state.season]);
    let bye;
    if (state.mood === 1) bye = "bye!! come back soon ok? <3";
    else if (state.mood === 3) bye = "....bye.";
    else bye = "see you later.";
    drawText(bye, 180, 300, state.mood === 1 ? GREEN : state.mood === 3 ? RED : YELLOW);
    saveToCloud();
    clearScreen(BLACK);
    return;
  }

  if (pointInRect(clickX, clickY, lilguy_rect)) {
    if (state.pets_today > 0) {
      state.bond += Math.round(1 * mods.bond_mult);
      state.pets_today -= 1;
      state.current_line = choice(["hehe", ":)", "that's nice"]);
    } else {
      state.current_line = "ok ok that's enough pets for now";
    }
    saveToCloud();
    return;
  }

  if (pointInRect(clickX, clickY, feed_rect)) {
    if (state.hunger < 20) {
      const gained = Math.min(3, 20 - state.hunger);
      state.hunger += gained;
      state.bond += Math.round(gained * 2 * mods.bond_mult);
    }
    saveToCloud();
  }
}

function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

function getCanvasCoords(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (clientX - rect.left) / canvasScale,
    y: (clientY - rect.top) / canvasScale,
  };
}

canvas.addEventListener("click", (e) => {
  const { x, y } = getCanvasCoords(e.clientX, e.clientY);
  handleClick(x, y);
});
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const { x, y } = getCanvasCoords(touch.clientX, touch.clientY);
  handleClick(x, y);
}, { passive: false });

  intervalId = setInterval(() => {
    tick();
    if (!state.running) clearInterval(intervalId);
  }, 1000);
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}


async function setupPush() {
  if (!("serviceWorker" in navigator)) {
    alert("serviceWorker not supported");
    return;
  }
  if (!("PushManager" in window)) {
    alert("PushManager not supported — likely iOS version below 16.4, or not launched from Home Screen");
    return;
  }

  let registration;
  try {
    registration = await navigator.serviceWorker.register("./sw.js");
    alert("service worker registered");
  } catch (e) {
    alert("service worker registration failed: " + e.message);
    return;
  }

  if (!("Notification" in window)) {
    alert("Notification API not available at all — must launch from Home Screen icon, not a Safari tab");
    return;
  }

  alert("about to request permission");
  const permission = await Notification.requestPermission();
  alert("permission result: " + permission);

  if (permission !== "granted") return;

    let subscription = await registration.pushManager.getSubscription();
  if (!subscription) {
    subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
    });
  }

  await fetch("https://lilguy-notifier.vercel.app/api/save-push", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(subscription)
  });

}
